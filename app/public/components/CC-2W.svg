<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100">
  <!--
    Carbon composition resistor, 2W: large brown cylindrical body with
    axial leads. Body drawn as a capsule using cubic-bezier rounded ends
    (no SVG arc commands — @pixi-essentials/svg mis-renders elliptic arcs).
    Pins carry id="pin-1"/"pin-2" — wire attachment points referenced by
    components.json -> pins[].svgId.
  -->

  <!-- Leads -->
  <line x1="10" y1="50" x2="75" y2="50" stroke="#9AA0A8" stroke-width="5" />
  <line x1="205" y1="50" x2="270" y2="50" stroke="#9AA0A8" stroke-width="5" />

  <!-- Body: brown carbon-comp cylinder, straight vertical sides -->
  <path
    d="M 82 18
       L 198 18
       C 200.5 18 202 19.5 202 22
       L 202 78
       C 202 80.5 200.5 82 198 82
       L 82 82
       C 79.5 82 78 80.5 78 78
       L 78 22
       C 78 19.5 79.5 18 82 18
       Z"
    fill="#4E2E1B" stroke="#20120A" stroke-width="4.5" />

  <!-- Color bands: digit-1, digit-2, multiplier, tolerance — recolored
       per-instance from the resistor's value (see colorCode.ts) -->
  <rect id="band-1" x="109" y="19" width="8" height="62" fill="#7B3F00" />
  <rect id="band-2" x="127" y="19" width="8" height="62" fill="#1A1A1A" />
  <rect id="band-3" x="145" y="19" width="8" height="62" fill="#E8D63A" />
  <rect id="band-4" x="163" y="19" width="8" height="62" fill="#C0C0C0" />

  <!-- Pins -->
  <g stroke-width="2.5">
    <circle id="pin-1" cx="10" cy="50" r="10" fill="#B9BEC7" stroke="#6E747E" />
    <circle cx="8" cy="48" r="3.6" fill="#E6E9EE" stroke="none" />

    <circle id="pin-2" cx="270" cy="50" r="10" fill="#B9BEC7" stroke="#6E747E" />
    <circle cx="268" cy="48" r="3.6" fill="#E6E9EE" stroke="none" />
  </g>
</svg>
