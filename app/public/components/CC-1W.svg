<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 80">
  <!--
    Carbon composition resistor, 1W: brown cylindrical body with axial
    leads. Body drawn as a capsule using cubic-bezier rounded ends (no
    SVG arc commands — @pixi-essentials/svg mis-renders elliptic arcs).
    Pins carry id="pin-1"/"pin-2" — wire attachment points referenced by
    components.json -> pins[].svgId.

    Sized so the rendered part is exactly 1.75in pin-to-pin (0.75in body
    + 0.5in leads each side) once scaled to its 0.2in declared height —
    see passiveValues.ts RESISTOR_SYMBOL_BY_POWER.
  -->

  <!-- Leads -->
  <line x1="0" y1="40" x2="200" y2="40" stroke="#9AA0A8" stroke-width="4" />
  <line x1="500" y1="40" x2="700" y2="40" stroke="#9AA0A8" stroke-width="4" />

  <!-- Body: brown carbon-comp cylinder, straight vertical sides -->
  <path
       d="M 204 16
       L 496 16
       C 497.8 16 500 18.2 500 20
       L 500 60
       C 500 61.8 497.8 64 496 64
       L 204 64
       C 202.2 64 200 61.8 200 60
       L 200 20
       C 200 18.2 202.2 16 204 16
       Z"
       fill="#4A2C1A" stroke="#1E1108" stroke-width="4" />

  <!-- Color bands: digit-1, digit-2, multiplier, tolerance — recolored
       per-instance from the resistor's value (see colorCode.ts) -->
  <rect id="band-1" x="284.55" y="17" width="16.36" height="46" fill="#7B3F00" />
  <rect id="band-2" x="322.73" y="17" width="16.36" height="46" fill="#1A1A1A" />
  <rect id="band-3" x="360.91" y="17" width="16.36" height="46" fill="#E8D63A" />
  <rect id="band-4" x="399.09" y="17" width="16.36" height="46" fill="#C0C0C0" />

  <!-- Pins -->
  <circle id="pin-1" cx="0" cy="40" r="9" fill="#B9BEC7" stroke="#6E747E" stroke-width="2" />
  <circle cx="1.7" cy="38.3" r="3.2" fill="#E6E9EE" stroke="none" />
  <circle id="pin-2" cx="700" cy="40" r="9" fill="#B9BEC7" stroke="#6E747E" stroke-width="2" />
  <circle cx="698.3" cy="38.3" r="3.2" fill="#E6E9EE" stroke="none" />
</svg>
