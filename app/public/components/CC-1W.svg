<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80">
  <!--
    Carbon composition resistor, 1W: medium brown cylindrical body with
    axial leads. Body drawn as a capsule using cubic-bezier rounded ends
    (no SVG arc commands — @pixi-essentials/svg mis-renders elliptic arcs).
    Pins carry id="pin-1"/"pin-2" — wire attachment points referenced by
    components.json -> pins[].svgId.
  -->

  <!-- Leads -->
  <line x1="10" y1="40" x2="65" y2="40" stroke="#9AA0A8" stroke-width="4" />
  <line x1="175" y1="40" x2="230" y2="40" stroke="#9AA0A8" stroke-width="4" />

  <!-- Body: brown carbon-comp cylinder, straight vertical sides -->
  <path
    d="M 69 16
       L 171 16
       C 173.2 16 175 17.8 175 20
       L 175 60
       C 175 62.2 173.2 64 171 64
       L 69 64
       C 66.8 64 65 62.2 65 60
       L 65 20
       C 65 17.8 66.8 16 69 16
       Z"
    fill="#4A2C1A" stroke="#1E1108" stroke-width="4" />

  <!-- Color bands: digit-1, digit-2, multiplier, tolerance — recolored
       per-instance from the resistor's value (see colorCode.ts) -->
  <rect id="band-1" x="96" y="17" width="6" height="46" fill="#7B3F00" />
  <rect id="band-2" x="110" y="17" width="6" height="46" fill="#1A1A1A" />
  <rect id="band-3" x="124" y="17" width="6" height="46" fill="#E8D63A" />
  <rect id="band-4" x="138" y="17" width="6" height="46" fill="#C0C0C0" />

  <!-- Pins -->
  <g stroke-width="2">
    <circle id="pin-1" cx="10" cy="40" r="9" fill="#B9BEC7" stroke="#6E747E" />
    <circle cx="8.3" cy="38.3" r="3.2" fill="#E6E9EE" stroke="none" />

    <circle id="pin-2" cx="230" cy="40" r="9" fill="#B9BEC7" stroke="#6E747E" />
    <circle cx="228.3" cy="38.3" r="3.2" fill="#E6E9EE" stroke="none" />
  </g>
</svg>
