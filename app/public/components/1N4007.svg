<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 80">
  <!--
    1N4007 axial silicon rectifier diode (DO-41 package): black
    cylindrical body with a silver cathode band near the right lead.
    Body drawn as a capsule using cubic-bezier rounded ends (no SVG arc
    commands — @pixi-essentials/svg mis-renders elliptic arcs). Pins carry
    id="pin-1" (anode) / id="pin-2" (cathode) — wire attachment points
    referenced by components.json -> pins[].svgId.

    Same 700x80 unit scale as the CC-1W resistor symbol, sized so the
    rendered part is 1.75in pin-to-pin (1.5in body + 0.5in leads) once
    scaled to its 0.2in declared height.
  -->

  <!-- Leads -->
  <line x1="0" y1="40" x2="200" y2="40" stroke="#9AA0A8" stroke-width="4" />
  <line x1="500" y1="40" x2="700" y2="40" stroke="#9AA0A8" stroke-width="4" />

  <!-- Body: black glass/epoxy cylinder, straight vertical sides -->
  <path
       d="M 204 16
       L 496 16
       C 497.8 16 500 18.2 500 20
       L 500 60
       C 500 61.8 497.8 64 496 64
       L 204 64
       C 202.2 64 200 61.8 200 60
       L 200 20
       C 200 18.2 202.2 16 204 16
       Z"
       fill="#141414" stroke="#000000" stroke-width="4" />

  <!-- subtle gloss highlight along the top of the cylinder -->
  <path d="M 214 24 L 486 24" stroke="#3C3C3C" stroke-width="3" stroke-linecap="round" />

  <!-- cathode band (silver), near the pin-2 (cathode) end -->
  <rect x="458" y="16" width="20" height="48" fill="#D8D8D8" stroke="#8A8A8A" stroke-width="1.5" />

  <!-- Pins -->
  <circle id="pin-1" cx="0" cy="40" r="9" fill="#B9BEC7" stroke="#6E747E" stroke-width="2" />
  <circle cx="1.7" cy="38.3" r="3.2" fill="#E6E9EE" stroke="none" />
  <circle id="pin-2" cx="700" cy="40" r="9" fill="#B9BEC7" stroke="#6E747E" stroke-width="2" />
  <circle cx="698.3" cy="38.3" r="3.2" fill="#E6E9EE" stroke="none" />
</svg>
