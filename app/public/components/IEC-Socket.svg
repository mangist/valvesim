<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200">
  <!--
    120V AC Input: IEC-320 C14 panel-mount mains inlet with integrated
    rocker switch, in the same flat illustrative style as the tube and
    transformer symbols. Mirrored from the reference photo per spec:
    switch on the LEFT, inlet socket (pins) on the RIGHT.

    The red rocker button itself is NOT drawn here — it's rendered as a
    live Pixi overlay by PlacedComponent so it can be clicked to toggle
    power on/off. The invisible rect id="switch-rocker" tells the engine
    where the button sits. All rounded corners use cubic-bezier paths
    (no rect rx / no SVG arc commands — @pixi-essentials/svg mis-renders
    arc-based geometry).

    3 pins for wire attachment: L (line/brown), N (neutral/blue),
    PE (protective earth/green-yellow striped). Each pin circle carries
    id="pin-<lead>" — the wire attachment point referenced by
    components.json → pins[].svgId.

    NOTE: solid colors only — the canvas SVG parser ignores
    fill-opacity/stroke-opacity/opacity.
  -->

  <!-- Panel's actual visual rectangle (outer stroke edge) — read by
       PlacedComponent.buildInletMeter to attach the current-draw readout
       flush to the panel bottom. The container's overall bounds equal the
       full viewBox (0,0-420,200), not this ink extent, so this marker is
       needed to avoid a gap below the blank viewBox margin. -->
  <rect id="panel-body" x="38" y="28" width="344" height="144" fill="none" stroke="none" />

  <!-- ==================== mounting ears / screw bosses ==================== -->
  <g stroke-width="2">
    <circle cx="60" cy="50" r="11" fill="#B9BEC7" stroke="#6E747E" />
    <line x1="53" y1="50" x2="67" y2="50" stroke="#6E747E" stroke-width="2" />
    <circle cx="360" cy="150" r="11" fill="#B9BEC7" stroke="#6E747E" />
    <line x1="353" y1="150" x2="367" y2="150" stroke="#6E747E" stroke-width="2" />
  </g>

  <!-- ==================== panel body (r=16 bezier corners) ==================== -->
  <path
       d="M 56 30
       L 364 30
       C 371.2 30 380 38.8 380 46
       L 380 154
       C 380 161.2 371.2 170 364 170
       L 56 170
       C 48.8 170 40 161.2 40 154
       L 40 46
       C 40 38.8 48.8 30 56 30
       Z"
       fill="#1B1B1E" stroke="#CDD6D2" stroke-width="3.5" />

  <!-- ==================== rocker switch recess (left, r=12 bezier corners) ==================== -->
  <path
       d="M 70 48
       L 178 48
       C 183.4 48 190 54.6 190 60
       L 190 140
       C 190 145.4 183.4 152 178 152
       L 70 152
       C 64.6 152 58 145.4 58 140
       L 58 60
       C 58 54.6 64.6 48 70 48
       Z"
       fill="#101012" stroke="#000000" stroke-width="2" />
  <!-- rocker button geometry marker: read by PlacedComponent, drawn as a
       clickable Pixi overlay (power on/off toggle) -->
  <rect id="switch-rocker" x="70" y="60" width="108" height="80" fill="none" stroke="none" />

  <!-- ==================== IEC C14 inlet recess (right, r=10 bezier corners) ==================== -->
  <path
       d="M 240 50
       L 340 50
       C 344.5 50 350 55.5 350 60
       L 350 140
       C 350 144.5 344.5 150 340 150
       L 240 150
       C 235.5 150 230 144.5 230 140
       L 230 60
       C 230 55.5 235.5 50 240 50
       Z"
       fill="#101012" stroke="#3A3F47" stroke-width="2.5" />
  <!-- line + neutral blade slots -->
  <rect x="258" y="68" width="10" height="30" fill="#3A3F47" stroke="#57606B" stroke-width="1.5" />
  <rect x="312" y="68" width="10" height="30" fill="#3A3F47" stroke="#57606B" stroke-width="1.5" />
  <!-- ground pin hole -->
  <circle cx="290" cy="122" r="7" fill="#3A3F47" stroke="#57606B" stroke-width="1.5" />

  <!-- ==================== pin leads ==================== -->
  <!-- left blade slot -> L, right blade slot -> N, ground hole -> PE.
       Pins are spaced 50 apart (was 30) so their fixed on-screen radius
       (independent of this symbol's scale) doesn't overlap. -->
  <g stroke-width="4">
    <line x1="258" y1="80"  x2="392" y2="50"  stroke="#7A4A2B" />
    <line x1="322" y1="80"  x2="392" y2="100" stroke="#3A6BC6" />
    <line x1="290" y1="122" x2="392" y2="150" stroke="#3E9B4F" />
  </g>
  <!-- PE 45° tracer stripe (green/yellow dual-color earth lead) -->
  <g stroke="#E8C33A" stroke-width="3">
    <line x1="356" y1="152" x2="360" y2="148" />
    <line x1="363" y1="152" x2="367" y2="148" />
    <line x1="370" y1="152" x2="374" y2="148" />
    <line x1="377" y1="152" x2="381" y2="148" />
  </g>

  <!-- ==================== pins ==================== -->
  <g stroke-width="2.5">
    <circle id="pin-l"  cx="398" cy="50"  r="9" fill="#7A4A2B" stroke="#15100C" />
    <circle id="pin-n"  cx="398" cy="100" r="9" fill="#3A6BC6" stroke="#15100C" />
    <circle id="pin-pe" cx="398" cy="150" r="9" fill="#3E9B4F" stroke="#15100C" />
  </g>
</svg>
