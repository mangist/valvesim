<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200">
  <!--
    120V AC Input: IEC-320 C14 panel-mount mains inlet with integrated
    rocker switch, in the same flat illustrative style as the tube and
    transformer symbols. Mirrored from the reference photo per spec:
    switch on the LEFT, inlet socket (pins) on the RIGHT.

    3 pins for wire attachment: L (line/brown), N (neutral/blue),
    PE (protective earth/green-yellow striped, 45° tracer like the
    transformer's dual-color leads). Each pin circle carries
    id="pin-<lead>" — the wire attachment point referenced by
    components.json → pins[].svgId.

    NOTE: solid colors only — the canvas SVG parser ignores
    fill-opacity/stroke-opacity/opacity.
  -->

  <!-- ==================== mounting ears / screw bosses ==================== -->
  <g stroke-width="2">
    <circle cx="60" cy="50" r="11" fill="#B9BEC7" stroke="#6E747E" />
    <line x1="53" y1="50" x2="67" y2="50" stroke="#6E747E" stroke-width="2" />
    <circle cx="360" cy="150" r="11" fill="#B9BEC7" stroke="#6E747E" />
    <line x1="353" y1="150" x2="367" y2="150" stroke="#6E747E" stroke-width="2" />
  </g>

  <!-- ==================== panel body ==================== -->
  <rect x="40" y="30" width="340" height="140" rx="16" fill="#1B1B1E" stroke="#CDD6D2" stroke-width="3.5" />

  <!-- ==================== rocker switch (left) ==================== -->
  <rect x="58" y="48" width="132" height="104" rx="12" fill="#101012" stroke="#000000" stroke-width="2" />
  <rect x="70" y="60" width="108" height="80" rx="9" fill="#D6362A" stroke="#7A1F18" stroke-width="2.5" />
  <!-- seesaw hinge hint -->
  <line x1="70" y1="100" x2="178" y2="100" stroke="#7A1F18" stroke-width="1.5" />
  <!-- "on" dash (IEC 60417-5007) -->
  <line x1="93" y1="80" x2="109" y2="80" stroke="#EDEDE6" stroke-width="4" stroke-linecap="round" />
  <!-- "off" circle (IEC 60417-5008) -->
  <circle cx="149" cy="120" r="9" fill="none" stroke="#EDEDE6" stroke-width="3.5" />

  <!-- ==================== IEC C14 inlet recess (right) ==================== -->
  <rect x="230" y="50" width="120" height="100" rx="10" fill="#101012" stroke="#3A3F47" stroke-width="2.5" />
  <!-- line + neutral blade slots -->
  <rect x="258" y="68" width="10" height="30" rx="2" fill="#3A3F47" stroke="#57606B" stroke-width="1.5" />
  <rect x="312" y="68" width="10" height="30" rx="2" fill="#3A3F47" stroke="#57606B" stroke-width="1.5" />
  <!-- ground pin hole -->
  <circle cx="290" cy="122" r="7" fill="#3A3F47" stroke="#57606B" stroke-width="1.5" />

  <!-- ==================== pin leads ==================== -->
  <!-- left blade slot -> L, right blade slot -> N, ground hole -> PE -->
  <g stroke-width="4">
    <line x1="258" y1="80"  x2="392" y2="70"  stroke="#7A4A2B" />
    <line x1="322" y1="80"  x2="392" y2="100" stroke="#3A6BC6" />
    <line x1="290" y1="122" x2="392" y2="130" stroke="#3E9B4F" />
  </g>
  <!-- PE 45° tracer stripe (green/yellow dual-color earth lead) -->
  <g stroke="#E8C33A" stroke-width="3">
    <line x1="356" y1="132" x2="360" y2="128" />
    <line x1="363" y1="132" x2="367" y2="128" />
    <line x1="370" y1="132" x2="374" y2="128" />
    <line x1="377" y1="132" x2="381" y2="128" />
  </g>

  <!-- ==================== pins ==================== -->
  <g stroke-width="2.5">
    <circle id="pin-l"  cx="398" cy="70"  r="9" fill="#7A4A2B" stroke="#15100C" />
    <circle id="pin-n"  cx="398" cy="100" r="9" fill="#3A6BC6" stroke="#15100C" />
    <circle id="pin-pe" cx="398" cy="130" r="9" fill="#3E9B4F" stroke="#15100C" />
  </g>
</svg>
