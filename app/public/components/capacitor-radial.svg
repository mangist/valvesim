<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150">
  <!--
    Radial-lead electrolytic: black-topped, gold/bronze-bodied can (e.g.
    Nichicon-style low-impedance electrolytic) with a top vent groove,
    printed silkscreen bars, and a light polarity stripe with "-" marks
    running the full height on the negative (pin-1, left) side — matching
    the reference photo. Both leads exit the base.

    NOTE: solid colors only — the canvas SVG parser ignores
    fill-opacity/stroke-opacity/opacity.
  -->

  <!-- Can body: gold/bronze base, full silhouette -->
  <rect x="20" y="10" width="60" height="100" rx="6" fill="#C9A24D" stroke="#5C4415" stroke-width="2" />
  <!-- Black top sleeve -->
  <rect x="20" y="10" width="60" height="38" rx="6" fill="#141414" stroke="#000000" stroke-width="2" />

  <!-- Top vent groove (embossed score mark) -->
  <line x1="50" y1="16" x2="50" y2="27" stroke="#3A3A3A" stroke-width="1.5" />
  <line x1="44.5" y1="21.5" x2="55.5" y2="21.5" stroke="#3A3A3A" stroke-width="1.5" />

  <!-- Polarity stripe with "-" marks, full height, negative (pin-1) side -->
  <rect x="22" y="14" width="6" height="90" fill="#A9A9A9" />
  <line x1="23" y1="34" x2="27" y2="34" stroke="#3A3A3A" stroke-width="1.5" />
  <line x1="23" y1="58" x2="27" y2="58" stroke="#3A3A3A" stroke-width="1.5" />
  <line x1="23" y1="82" x2="27" y2="82" stroke="#3A3A3A" stroke-width="1.5" />

  <!-- Printed silkscreen bars (brand/spec lines, abstracted rather than real text) -->
  <rect x="32" y="55" width="42" height="5" rx="1.5" fill="#EDEDE6" />
  <rect x="32" y="66" width="28" height="4" rx="1.5" fill="#EDEDE6" />
  <rect x="32" y="74" width="34" height="4" rx="1.5" fill="#EDEDE6" />

  <!-- Leads -->
  <line x1="40" y1="110" x2="40" y2="150" stroke="#C7CCD1" stroke-width="3" />
  <line x1="60" y1="110" x2="60" y2="150" stroke="#C7CCD1" stroke-width="3" />

  <circle id="pin-1" cx="40" cy="150" r="0.1" fill="none" />
  <circle id="pin-2" cx="60" cy="150" r="0.1" fill="none" />
</svg>
