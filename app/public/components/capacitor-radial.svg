<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150">
  <!--
    Radial-lead electrolytic: Nichicon-style gold/brass can with a solid
    black polarity stripe running the full height of the negative
    (pin-1, left) side, matching the reference photo. A subtle top-rim
    ellipse gives the can a rounded-shoulder look. No rect rx / SVG arc
    ('A') path commands — @pixi-essentials/svg mis-renders them as
    malformed, self-intersecting geometry (same fix as the film cap body
    and the tube dome elsewhere in this library); ellipse/circle
    primitives render fine and are used freely.

    NOTE: solid colors only — the canvas SVG parser ignores
    fill-opacity/stroke-opacity/opacity.
  -->

  <!-- Can body: flat-sided gold/brass cylinder -->
  <rect x="20" y="14" width="60" height="96" fill="#C9A24D" stroke="#5C4415" stroke-width="2" />
  <!-- top rim: rounded-shoulder look -->
  <ellipse cx="50" cy="14" rx="30" ry="7" fill="#D8B463" stroke="#5C4415" stroke-width="2" />
  <!-- gloss highlight -->
  <line x1="64" y1="21" x2="64" y2="103" stroke="#E8C97A" stroke-width="4" stroke-linecap="round" />

  <!-- Polarity stripe: solid black, full height, negative (pin-1) side.
       Starts a touch above the body's top edge so it blends into the
       rounded shoulder instead of cutting off sharply. -->
  <rect x="20" y="10" width="20" height="100" fill="#141414" />
  <!-- polarity mark: "-" on the black (negative, pin-1) stripe -->
  <line x1="24.5" y1="29.5" x2="35.5" y2="29.5" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" />

  <!-- Printed silkscreen bars (brand/spec lines, abstracted rather than real text) -->
  <rect x="44" y="55" width="30" height="5" fill="#EDEDE6" />
  <rect x="44" y="66" width="20" height="4" fill="#EDEDE6" />
  <rect x="44" y="74" width="24" height="4" fill="#EDEDE6" />

  <!-- Leads -->
  <line x1="40" y1="110" x2="40" y2="150" stroke="#C7CCD1" stroke-width="3" />
  <line x1="60" y1="110" x2="60" y2="150" stroke="#C7CCD1" stroke-width="3" />

  <circle id="pin-1" cx="40" cy="150" r="0.1" fill="none" />
  <circle id="pin-2" cx="60" cy="150" r="0.1" fill="none" />
</svg>
