<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320">
  <!--
    PC-mount trimmer/control potentiometer: knurled metal bushing with hex
    mounting nut, cream rotor shaft, small PCB body, 3 bent solder pins
    (CCW lug, wiper, CW lug) — same flat illustrative style as the other
    symbols. Each pin circle carries id="pin-<n>" — the wire attachment
    point referenced by components.json -> pins[].svgId. Pin numbers are
    called out with small text labels above each pad.

    NOTE: solid colors only — the canvas SVG parser ignores
    fill-opacity/stroke-opacity/opacity.
  -->

  <!-- ==================== shaft ==================== -->
  <rect x="103" y="18" width="34" height="78" rx="14" fill="#E8DFC0" stroke="#9A9370" stroke-width="2.5" />

  <!-- ==================== knurled bushing ==================== -->
  <circle cx="120" cy="112" r="44" fill="#2A2C34" stroke="#6E747E" stroke-width="2.5" />
  <g stroke="#4E545F" stroke-width="2">
    <line x1="120" y1="70" x2="120" y2="78" />
    <line x1="150" y1="82" x2="144" y2="88" />
    <line x1="162" y1="112" x2="154" y2="112" />
    <line x1="150" y1="142" x2="144" y2="136" />
    <line x1="120" y1="154" x2="120" y2="146" />
    <line x1="90" y1="142" x2="96" y2="136" />
    <line x1="78" y1="112" x2="86" y2="112" />
    <line x1="90" y1="82" x2="96" y2="88" />
  </g>

  <!-- ==================== hex mounting nut ==================== -->
  <path d="M 120 76 L 148 92 L 148 124 L 120 140 L 92 124 L 92 92 Z"
    fill="#B9BEC7" stroke="#6E747E" stroke-width="2.5" />
  <path d="M 120 76 L 148 92 L 148 124 L 120 140 L 92 124 L 92 92 Z"
    fill="none" stroke="#DDE2E8" stroke-width="1.5" transform="translate(-1,-1)" />
  <circle cx="120" cy="108" r="16" fill="#2A2C34" stroke="#565D68" stroke-width="2" />

  <!--
    Wiper pivot: not drawn (r=0) — read by PlacedComponent to anchor the
    draggable wiper-position indicator drawn at runtime. data-radius is
    the indicator arm length in symbol units.
  -->
  <circle id="wiper-pivot" cx="120" cy="108" r="0" data-radius="34" />

  <!-- ==================== PCB body ==================== -->
  <rect x="42" y="150" width="156" height="118" rx="6" fill="#23252C" stroke="#CDD6D2" stroke-width="3.5" />
  <!-- copper via -->
  <circle cx="60" cy="176" r="5" fill="#B5651D" stroke="#5A2E0D" stroke-width="1.5" />

  <!-- ==================== pin leads ==================== -->
  <g stroke-width="4" fill="none">
    <path d="M 78 268 L 78 292 L 66 292 L 66 300" stroke="#B9BEC7" />
    <path d="M 120 268 L 120 300" stroke="#B9BEC7" />
    <path d="M 162 268 L 162 292 L 174 292 L 174 300" stroke="#B9BEC7" />
  </g>

  <!-- ==================== pins ==================== -->
  <g stroke-width="2.5">
    <circle id="pin-1" cx="66" cy="308" r="9" fill="#B9BEC7" stroke="#565D68" />
    <circle id="pin-2" cx="120" cy="308" r="9" fill="#B9BEC7" stroke="#565D68" />
    <circle id="pin-3" cx="174" cy="308" r="9" fill="#B9BEC7" stroke="#565D68" />
  </g>

  <!-- ==================== pin labels ==================== -->
  <g fill="#CDD6D2" font-family="'Inter','Segoe UI',sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <text x="66" y="286">1</text>
    <text x="120" y="286">2</text>
    <text x="174" y="286">3</text>
  </g>
</svg>
