<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!--
    Ground Point: single-pin chassis/earth ground symbol — a vertical lead
    down to three horizontal bars of decreasing width. Same flat illustrative
    style as the other symbols; solid fills only (the canvas SVG parser
    ignores fill-opacity/stroke-opacity/opacity).

    Single wire attachment point at the top of the lead: id="pin-gnd".
  -->
  <g stroke="#CDD6D2" stroke-width="10" stroke-linecap="square">
    <line x1="100" y1="20" x2="100" y2="130" />
    <line x1="55" y1="130" x2="145" y2="130" />
    <line x1="70" y1="160" x2="130" y2="160" />
    <line x1="85" y1="190" x2="115" y2="190" />
  </g>

  <circle id="pin-gnd" cx="100" cy="20" r="10" fill="#CDD6D2" stroke="#6E747E" stroke-width="2" />
</svg>
