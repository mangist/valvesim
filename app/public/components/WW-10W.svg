<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 340">
  <!--
    Wirewound power resistor, 10W: chunky cream/vitreous-enamel cylindrical
    body (distinct from the carbon-comp brown, and noticeably thicker in
    proportion than the small-signal resistors) with axial leads, larger
    than the 5W part. Body drawn as a capsule using cubic-bezier rounded
    ends (no SVG arc commands — @pixi-essentials/svg mis-renders elliptic
    arcs). Pins carry id="pin-1"/"pin-2" — wire attachment points
    referenced by components.json -> pins[].svgId.

    Sized so the rendered part is exactly 4.5in pin-to-pin (2.5in body +
    1in leads each side) once scaled to its 0.85in declared height — see
    passiveValues.ts RESISTOR_SYMBOL_BY_POWER.
  -->

  <!-- Leads -->
  <line x1="0" y1="170" x2="400" y2="170" stroke="#9AA0A8" stroke-width="17" />
  <line x1="1400" y1="170" x2="1800" y2="170" stroke="#9AA0A8" stroke-width="17" />

  <!-- Body: cream vitreous-enamel cylinder, straight vertical sides -->
  <path
       d="M 417 68
       L 1383 68
       C 1390.65 68 1400 77.35 1400 85
       L 1400 255
       C 1400 262.65 1390.65 272 1383 272
       L 417 272
       C 409.35 272 400 262.65 400 255
       L 400 85
       C 400 77.35 409.35 68 417 68
       Z"
       fill="#E7DFC6" stroke="#8A8161" stroke-width="17" />

  <!-- Color bands: digit-1, digit-2, multiplier, tolerance — recolored
       per-instance from the resistor's value (see colorCode.ts) -->
  <rect id="band-1" x="681.82" y="69" width="54.55" height="202" fill="#7B3F00" />
  <rect id="band-2" x="809.09" y="69" width="54.55" height="202" fill="#1A1A1A" />
  <rect id="band-3" x="936.36" y="69" width="54.55" height="202" fill="#E8D63A" />
  <rect id="band-4" x="1063.63" y="69" width="54.55" height="202" fill="#C0C0C0" />

  <!-- Pins -->
  <circle id="pin-1" cx="0" cy="170" r="38.25" fill="#B9BEC7" stroke="#6E747E" stroke-width="8.5" />
  <circle cx="7.23" cy="162.78" r="13.6" fill="#E6E9EE" stroke="none" />
  <circle id="pin-2" cx="1800" cy="170" r="38.25" fill="#B9BEC7" stroke="#6E747E" stroke-width="8.5" />
  <circle cx="1792.78" cy="162.78" r="13.6" fill="#E6E9EE" stroke="none" />
</svg>
