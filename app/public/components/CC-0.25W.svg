<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 50">
  <!--
    Carbon composition resistor, 0.25W: smallest body, brown cylindrical
    with axial leads. Body drawn as a capsule using cubic-bezier rounded
    ends (no SVG arc commands — @pixi-essentials/svg mis-renders elliptic
    arcs). Pins carry id="pin-1"/"pin-2" — wire attachment points
    referenced by components.json -> pins[].svgId.

    Sized so the rendered part is exactly 1.35in pin-to-pin (0.25in body +
    0.5in leads each side) once scaled to its 0.125in declared height —
    see passiveValues.ts RESISTOR_SYMBOL_BY_POWER.
  -->

  <!-- Leads -->
  <line x1="0" y1="25" x2="200" y2="25" stroke="#9AA0A8" stroke-width="2.5" />
  <line x1="340" y1="25" x2="540" y2="25" stroke="#9AA0A8" stroke-width="2.5" />

  <!-- Body: brown carbon-comp cylinder, straight vertical sides -->
  <path
       d="M 202.5 10
       L 337.5 10
       C 338.63 10 340 11.37 340 12.5
       L 340 37.5
       C 340 38.63 338.63 40 337.5 40
       L 202.5 40
       C 201.37 40 200 38.63 200 37.5
       L 200 12.5
       C 200 11.37 201.37 10 202.5 10
       Z"
       fill="#3A2214" stroke="#170D07" stroke-width="2.5" />

  <!-- Color bands: digit-1, digit-2, multiplier, tolerance — recolored
       per-instance from the resistor's value (see colorCode.ts) -->
  <rect id="band-1" x="239.45" y="11" width="7.64" height="28" fill="#7B3F00" />
  <rect id="band-2" x="257.27" y="11" width="7.64" height="28" fill="#1A1A1A" />
  <rect id="band-3" x="275.09" y="11" width="7.64" height="28" fill="#E8D63A" />
  <rect id="band-4" x="292.91" y="11" width="7.64" height="28" fill="#C0C0C0" />

  <!-- Pins -->
  <circle id="pin-1" cx="0" cy="25" r="5.63" fill="#B9BEC7" stroke="#6E747E" stroke-width="1.25" />
  <circle cx="1.06" cy="23.94" r="2" fill="#E6E9EE" stroke="none" />
  <circle id="pin-2" cx="540" cy="25" r="5.63" fill="#B9BEC7" stroke="#6E747E" stroke-width="1.25" />
  <circle cx="538.94" cy="23.94" r="2" fill="#E6E9EE" stroke="none" />
</svg>
