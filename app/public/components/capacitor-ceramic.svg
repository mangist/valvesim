<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150">
  <!--
    Ceramic disc capacitor: orange dipped disc viewed face-on with two
    long tinned leads dropping straight down from the underside —
    matching the reference photo. Printed value/date-code markings are
    abstracted as silkscreen bars rather than real text.

    NOTE: solid colors only — the canvas SVG parser ignores
    fill-opacity/stroke-opacity/opacity.
  -->

  <!-- Leads -->
  <line x1="38" y1="62" x2="38" y2="150" stroke="#C7CCD1" stroke-width="3.5" />
  <line x1="62" y1="62" x2="62" y2="150" stroke="#C7CCD1" stroke-width="3.5" />

  <!-- Disc body -->
  <circle cx="50" cy="38" r="35" fill="#D8821E" stroke="#8A4A12" stroke-width="2.5" />
  <!-- subtle rim highlight -->
  <circle cx="50" cy="38" r="29" fill="none" stroke="#E89B45" stroke-width="2" />

  <!-- Printed markings (value + date code, abstracted) -->
  <g fill="#7A3E0C">
    <rect x="36" y="27" width="28" height="5" rx="1.5" />
    <rect x="40" y="42" width="20" height="5" rx="1.5" />
  </g>

  <circle id="pin-1" cx="38" cy="150" r="0.1" fill="none" />
  <circle id="pin-2" cx="62" cy="150" r="0.1" fill="none" />
</svg>
