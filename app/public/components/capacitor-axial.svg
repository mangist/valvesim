<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100">
  <!--
    Axial-lead electrolytic: blue cylindrical can, flat disc end-caps,
    and a black chevron-arrow band pointing at the negative lead — the
    standard polarity marking on this style of can (matches the
    reference photo). Polarized: pin-1 (left) is NEGATIVE, pin-2
    (right) is POSITIVE, each labeled with a -/+ glyph.

    Sized so the rendered part is exactly 3in pin-to-pin (1in body +
    1in leads each side) once scaled to its 0.5in declared height — see
    passiveValues.ts CAPACITOR symbol table.

    NOTE: solid colors only — the canvas SVG parser ignores
    fill-opacity/stroke-opacity/opacity.
  -->

  <!-- leads -->
  <line x1="0" y1="45" x2="200" y2="45" stroke="#c9c2b4" stroke-width="3" />
  <line x1="400" y1="45" x2="600" y2="45" stroke="#c9c2b4" stroke-width="3" />

  <!-- can body -->
  <rect x="200" y="15" width="200" height="60" fill="#2159A6" stroke="#0F2A54" stroke-width="2" />
  <!-- flat disc end-caps (cylinder viewed slightly off-axis) -->
  <ellipse cx="200" cy="45" rx="12" ry="30" fill="#163E7D" stroke="#0F2A54" stroke-width="2" />
  <ellipse cx="400" cy="45" rx="12" ry="30" fill="#16407F" stroke="#0F2A54" stroke-width="2" />
  <!-- gloss highlight -->
  <path d="M 221 20 L 379 20" stroke="#4E7FC7" stroke-width="4" stroke-linecap="round" />

  <!-- polarity band: chevrons pointing left, toward the negative lead -->
  <g fill="#111318">
    <path d="M 368.42 22 L 350 45 L 368.42 68 L 381.58 68 L 363.16 45 L 381.58 22 Z" />
    <path d="M 334.21 22 L 315.79 45 L 334.21 68 L 347.37 68 L 328.95 45 L 347.37 22 Z" />
    <path d="M 300 22 L 281.58 45 L 300 68 L 313.16 68 L 294.74 45 L 313.16 22 Z" />
    <path d="M 265.79 22 L 247.37 45 L 265.79 68 L 278.95 68 L 260.53 45 L 278.95 22 Z" />
    <path d="M 236.84 22 L 213.16 45 L 236.84 68 L 250 68 L 226.32 45 L 250 22 Z" />
  </g>

  <!-- polarity labels (drawn as shapes, not text, for reliable rendering):
       pin-1 (left) negative, pin-2 (right) positive -->
  <rect x="73.33" y="86" width="16" height="5" rx="2" fill="#eaf2ef" />
  <rect x="473.33" y="86" width="16" height="5" rx="2" fill="#eaf2ef" />
  <rect x="491.67" y="79.5" width="5" height="16" rx="2" fill="#eaf2ef" />

  <circle id="pin-1" cx="0" cy="45" r="0.1" fill="none" />
  <circle id="pin-2" cx="600" cy="45" r="0.1" fill="none" />
</svg>
