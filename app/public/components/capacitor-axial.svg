<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 100">
  <!--
    Axial-lead electrolytic: blue cylindrical can, flat disc end-caps,
    and a black chevron-arrow band pointing at the negative lead — the
    standard polarity marking on this style of can (matches the
    reference photo). Polarized: pin-1 (left) is NEGATIVE, pin-2
    (right) is POSITIVE, each labeled with a -/+ glyph.

    NOTE: solid colors only — the canvas SVG parser ignores
    fill-opacity/stroke-opacity/opacity.
  -->

  <!-- leads -->
  <line x1="0" y1="45" x2="60" y2="45" stroke="#c9c2b4" stroke-width="3" />
  <line x1="212" y1="45" x2="272" y2="45" stroke="#c9c2b4" stroke-width="3" />

  <!-- can body -->
  <rect x="60" y="15" width="152" height="60" fill="#2159A6" stroke="#0F2A54" stroke-width="2" />
  <!-- flat disc end-caps (cylinder viewed slightly off-axis) -->
  <ellipse cx="60" cy="45" rx="9" ry="30" fill="#163E7D" stroke="#0F2A54" stroke-width="2" />
  <ellipse cx="212" cy="45" rx="9" ry="30" fill="#16407F" stroke="#0F2A54" stroke-width="2" />
  <!-- gloss highlight -->
  <path d="M 76 20 L 196 20" stroke="#4E7FC7" stroke-width="4" stroke-linecap="round" />

  <!-- polarity band: chevrons pointing left, toward the negative lead -->
  <g fill="#111318">
    <path d="M 188 22 L 174 45 L 188 68 L 198 68 L 184 45 L 198 22 Z" />
    <path d="M 162 22 L 148 45 L 162 68 L 172 68 L 158 45 L 172 22 Z" />
    <path d="M 136 22 L 122 45 L 136 68 L 146 68 L 132 45 L 146 22 Z" />
    <path d="M 110 22 L 96  45 L 110 68 L 120 68 L 106 45 L 120 22 Z" />
    <path d="M 88  22 L 70  45 L 88  68 L 98  68 L 80  45 L 98  22 Z" />
  </g>

  <!-- polarity labels (drawn as shapes, not text, for reliable rendering):
       pin-1 (left) negative, pin-2 (right) positive -->
  <rect x="22" y="86" width="16" height="5" rx="2" fill="#eaf2ef" />
  <rect x="234" y="86" width="16" height="5" rx="2" fill="#eaf2ef" />
  <rect x="239.5" y="79.5" width="5" height="16" rx="2" fill="#eaf2ef" />

  <circle id="pin-1" cx="0" cy="45" r="0.1" fill="none" />
  <circle id="pin-2" cx="272" cy="45" r="0.1" fill="none" />
</svg>
